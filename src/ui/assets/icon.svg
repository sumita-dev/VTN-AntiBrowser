<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Punchy High-Contrast Apple Electric Orange Gradient -->
    <linearGradient id="appleOrangeGrad" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#FFA133" />
      <stop offset="30%" stop-color="#FF6A00" />
      <stop offset="75%" stop-color="#F04800" />
      <stop offset="100%" stop-color="#C72E00" />
    </linearGradient>

    <!-- Specular Ambient Rim Light -->
    <linearGradient id="rimLightGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="35%" stop-color="#FFA855" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>

    <!-- Deep Contrast Dark Shield Gradient -->
    <linearGradient id="shieldPlateGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#260C02" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#120400" stop-opacity="0.88" />
    </linearGradient>

    <!-- Key Drop Shadow for Squircle -->
    <filter id="squircleShadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#B32B00" flood-opacity="0.55" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#5E1600" flood-opacity="0.4" />
    </filter>

    <!-- Drop Shadow for Central Shield Emblem (Pops against orange) -->
    <filter id="emblemShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#4D1300" flood-opacity="0.7" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Ambient / Key Shadow -->
  <g filter="url(#squircleShadow)">
    <!-- Apple Squircle Base -->
    <rect x="20" y="20" width="472" height="472" rx="108" ry="108" fill="url(#appleOrangeGrad)" />
  </g>

  <!-- Ultra-fine Inset Rim Light (Apple signature beveled edge) -->
  <rect x="22" y="22" width="468" height="468" rx="106" ry="106" fill="none" stroke="url(#rimLightGrad)" stroke-width="3.5" />

  <!-- Top Glass Sheen Reflection -->
  <path d="M 24 130 C 24 70, 70 24, 130 24 L 382 24 C 442 24, 488 70, 488 130 C 488 145, 390 195, 256 195 C 122 195, 24 145, 24 130 Z"
        fill="#FFFFFF" opacity="0.12" />

  <!-- High-Contrast Enlarged Center Emblem (Scale 1.25 for bold presence) -->
  <g id="emblem" transform="translate(256, 256) scale(1.22)" filter="url(#emblemShadow)">
    <!-- Deep Contrast Dark Shield Backing Plate -->
    <path d="M 0 -144
             C 76 -144, 132 -128, 142 -122
             C 148 -28, 136 65, 0 152
             C -136 65, -148 -28, -142 -122
             C -132 -128, -76 -144, 0 -144 Z"
          fill="url(#shieldPlateGrad)" />

    <!-- Bold High-Contrast Solid White Outer Shield Frame -->
    <path d="M 0 -140
             C 72 -140, 126 -125, 136 -120
             C 141 -28, 130 60, 0 144
             C -130 60, -141 -28, -136 -120
             C -126 -125, -72 -140, 0 -140 Z"
          fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Solid White Browser Header Notch -->
    <rect x="-88" y="-104" width="176" height="30" rx="9" ry="9" fill="#FFFFFF" />

    <!-- Apple System Traffic Lights (Vibrant Red, Amber, Green) -->
    <circle cx="-64" cy="-89" r="6" fill="#FF3B30" />
    <circle cx="-46" cy="-89" r="6" fill="#FFCC00" />
    <circle cx="-28" cy="-89" r="6" fill="#34C759" />

    <!-- Incognito Address Bar Pill -->
    <rect x="-10" y="-97" width="90" height="16" rx="8" fill="rgba(30, 10, 2, 0.25)" />

    <!-- Solid High-Contrast VTN Monogram Geometric Core -->
    <!-- Left Wing of V -->
    <path d="M -82 -54 L -36 50 L -12 50 L -46 -54 Z" fill="#FFFFFF" />

    <!-- Right Wing of V -->
    <path d="M 82 -54 L 36 50 L 12 50 L 46 -54 Z" fill="#FFFFFF" />

    <!-- Center Chevron Spearhead -->
    <path d="M -26 -54 L 0 10 L 26 -54 Z" fill="#FFFFFF" />

    <!-- Bold Radar Stealth Pulse Wave -->
    <path d="M -94 14 C -48 56, 48 56, 94 14"
          fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-dasharray="10 7" />

    <!-- Central Stealth Core Node -->
    <circle cx="0" cy="56" r="9" fill="#FFFFFF" />
    <circle cx="0" cy="56" r="17" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.8" />
  </g>
</svg>
